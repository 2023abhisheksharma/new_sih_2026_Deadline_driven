<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Crisp dark outline shadow for high contrast on ice & water -->
    <filter id="contrast" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.2" flood-color="#020617" flood-opacity="0.95"/>
    </filter>
  </defs>

  <g filter="url(#contrast)">
    <!-- Heading vector tick -->
    <line x1="16" y1="4" x2="16" y2="1" stroke="#f8fafc" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Minimalist Top-Down Vessel Hull Silhouette -->
    <path d="M16 4
             C18.5 8, 21.5 13, 21.5 20
             L21.5 26
             L19.5 27.5
             L12.5 27.5
             L10.5 26
             L10.5 20
             C10.5 13, 13.5 8, 16 4 Z"
          fill="#f8fafc"
          stroke="#0f172a"
          stroke-width="1.4"
          stroke-linejoin="round"/>

    <!-- Minimalist Bridge / Navigation Deckhouse Core (Dark Slate cutout) -->
    <rect x="13.5" y="16" width="5" height="5" rx="0.8" fill="#0f172a"/>
    <circle cx="16" cy="24" r="0.8" fill="#0f172a"/>
  </g>
</svg>
