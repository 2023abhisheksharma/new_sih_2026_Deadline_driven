<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="dep-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="1" flood-color="#020617" flood-opacity="0.95"/>
    </filter>
  </defs>
  <g filter="url(#dep-shadow)">
    <!-- Outer delicate ring -->
    <circle cx="12" cy="12" r="8" fill="#0f172a" fill-opacity="0.8" stroke="#10b981" stroke-width="1.2"/>
    <!-- Center coordinate dot -->
    <circle cx="12" cy="12" r="3" fill="#10b981"/>
    <!-- Crosshair cardinal ticks -->
    <line x1="12" y1="2" x2="12" y2="4.5" stroke="#10b981" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="12" y1="19.5" x2="12" y2="22" stroke="#10b981" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="2" y1="12" x2="4.5" y2="12" stroke="#10b981" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="19.5" y1="12" x2="22" y2="12" stroke="#10b981" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
